spring.application.name=stockpulse
server.port=8080

# --- Persistence: in-memory H2, schema from JPA, seeded by bootstrap/DataSeeder ---
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Frontend origins (React/Vite 5173, Angular 4200) ---
stockpulse.cors.allowed-origins=http://localhost:5173,http://localhost:4200

# --- Commerce engine ---
# Switchable at runtime via PATCH /admin/commerce-strategy - no restart required.
# aiAdvisor degrades to ruleBased automatically when LLM_API_KEY is absent or the call fails.
commerce.active-strategy=aiAdvisor
commerce.agentic-loop-enabled=true
commerce.low-stock-increase-pct=10
commerce.velocity-premium-pct=5
commerce.velocity-premium-multiplier=2.0
commerce.demand-spike-multiplier=3.0
commerce.reorder-target-multiplier=3
commerce.default-lead-time-days=7
commerce.max-ai-price-change-pct=50
commerce.max-ai-reorder-multiplier=20

# --- LLM gateway (Groq). Key comes from the environment, never the repo. ---
llm.provider=groq
llm.api-key=${LLM_API_KEY:}
# Groq retired llama-3.1-8b-instant for free/developer tiers on 2026-08-16;
# openai/gpt-oss-20b is their published replacement.
llm.model=openai/gpt-oss-20b
llm.base-url=https://api.groq.com
llm.timeout-seconds=30
llm.temperature=0.5
# Budget covers reasoning + the JSON answer. 500 was enough for Llama 3.1; gpt-oss spends
# part of the budget thinking first and returned empty content under that ceiling.
llm.max-tokens=2048

# --- Logging: the agentic loop and every AI decision stay visible during the walkthrough ---
logging.level.com.stockpulse=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{28} - %msg%n
